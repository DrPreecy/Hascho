schema_version: 1
project:
  name: Hascho
  purpose: Design a universal project-local Idea-to-Business Workbench
  owner_role: Project Owner
  repository_role: conception workspace and future reusable template source

status:
  stage: CONCEPTION
  activity: RESEARCH
  gate: R1
  condition: research_in_progress
  software_implementation_authorized: false
  tech_stack_authorized: false

current_context:
  question: What sourced findings, tensions, and gaps should shape the universal workbench during Stage 2 research?
  last_event: Project Owner approved the revised research and conception plan at Gate R0
  next_action: Execute Stage 2 research synthesis using the approved plan and record sourced findings in project/RESEARCH-LOG.md
  resume_instruction: Read AGENTS.md, docs/START-HERE.md, and the approved research plan, then begin Stage 2 research without implementing software

approved_decisions:
  - id: DEC-001
    summary: The system is human-led and AI-supported
  - id: DEC-002
    summary: The future workbench is project-local, not one central interface for all projects
  - id: DEC-003
    summary: Provide a clear universal transformation sequence with adaptable content and return paths
  - id: DEC-004
    summary: Use the software roadmap only as thematic orientation for relevant software projects
  - id: DEC-005
    summary: Quality of life includes visible plans, next actions, differentiated to-dos, prompt suggestions, and resume support
  - id: DEC-006
    summary: Software modules require proportional anti-vibe-coding safeguards
  - id: DEC-007
    summary: The revised research and conception plan is approved as the basis for the research phase

provisional_directions:
  - id: DIR-001
    summary: Adaptive Project Workbench
  - id: DIR-002
    summary: Visual Control Room as the primary orientation concept, with specialized views for other questions
  - id: DIR-003
    summary: File-backed, provider-independent durable project state

open_blockers:
  - Implementation architecture and software building remain out of scope until explicit authorization at Gate R6

authoritative_files:
  - docs/PRODUCT-BRIEF.md
  - docs/RESEARCH-PLAN.md
  - docs/REFERENCE-INPUTS.md
  - docs/QUALITY-OF-LIFE.md
  - docs/ANTI-VIBE-CODING.md
  - docs/DELIVERABLES-AND-GATES.md
  - project/DECISIONS.md
